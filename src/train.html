<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Config</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <a href="index.html" class="back-button"></a>
    <h2>Train Config</h2>
    <form id="train-options" class="form-menu">
        <button type="button" class="select-file w-full" id="model-file-select" name="model-file-select">
            Model File
        </button>
        <button type="button" class="select-file w-full" id="model-file-select" name="model-file-select">
            YAML File
        </button>
        <label>
            <span>Epochs</span>
            <input type="number" placeholder="Number of Epochs" id="epochs" name="epochs" />
        </label>
        <button type="submit" id="submit-train-config">Train</button>
    </form>
    <script src="trainRenderer.js"></script>
</body>
</html>
